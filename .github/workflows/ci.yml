name: CI
on:
  push:
  pull_request:
jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m src.run_quality sample_data/transactions.csv contracts/transactions.yml
      - run: pytest -q
